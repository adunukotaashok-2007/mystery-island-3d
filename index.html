<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Mystery Island 3D</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game">
        <div id="loading">
            Loading Mystery Island...
        </div>

        <div id="hud">
            <div id="gameTitle">
                🏝️ Mystery Island
            </div>

            <div id="treasure">
                💎 Treasures: 0
            </div>
        </div>

        <div id="message">
            Explore the island!
        </div>

        <div id="joystick">
            <div id="joystickUp">▲</div>

            <div id="joystickMiddle">
                <div id="joystickLeft">◀</div>
                <div id="joystickDown">▼</div>
                <div id="joystickRight">▶</div>
            </div>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <!-- Our game -->
    <script src="game.js"></script>

</body>

</html>
